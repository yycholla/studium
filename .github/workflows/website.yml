name: Studium website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Finish migrations/deployments before another main run can start.
concurrency:
  group: studium-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
      - name: Verify public collection provider contract
        run: node tests/collect-live.mjs
      - name: Check and build in devenv
        run: devenv shell -- studium-check
      - name: Verify lockfiles stayed unchanged
        run: git diff --exit-code -- devenv.lock package-lock.json Cargo.lock
      - name: Install browser QA tools
        run: |
          npm install --no-save --package-lock=false playwright@1.59.1
          npx playwright install --with-deps chromium
      - name: Check Field Notes in Chromium
        run: node tests/field-notes-browser.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studium-browser-${{ github.sha }}
          path: test-results/field-notes-*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: studium-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://studium.yycholla.com
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for secret_name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if test -z "${!secret_name}"; then
              echo "::error::Missing $secret_name. Add it in repository Actions secrets."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
      - uses: actions/download-artifact@v4
        with:
          name: studium-site-${{ github.sha }}
          path: dist/
      - name: Apply D1 migrations and deploy checked build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: devenv shell -- bash deploy/cloudflare.sh --built
      - name: Verify public site
        run: |
          set -euo pipefail
          check_url() {
            local path="$1"
            local body="$RUNNER_TEMP/studium-response.html"
            local headers="$RUNNER_TEMP/studium-response.headers"
            if ! curl --fail-with-body --location --silent --show-error --connect-timeout 10 --max-time 30 --retry 5 --retry-all-errors --retry-delay 5 --dump-header "$headers" --output "$body" "https://studium.yycholla.com$path"; then
              echo "::error::Public check failed for $path after Cloudflare deployment succeeded."
              grep -Ei '^(HTTP/|server:|cf-ray:|cf-mitigated:|location:)' "$headers" || true
              head -c 2000 "$body" || true
              return 1
            fi
            if test "$path" = "/healthz"; then
              grep -Fx ok "$body"
            elif test "$path" = "/api/auth/session"; then
              jq -e '.configured == true and .account == null' "$body"
            elif test "$path" = "/field-notes"; then
              grep -Fq 'id="field-library"' "$body"
            elif [[ "$path" == /api/field-notes/catalog* ]]; then
              jq -e '.items | length > 0' "$body"
            else
              grep -Fq 'id="account-status"' "$body"
            fi
          }
          check_url /healthz
          check_url /account
          check_url /api/auth/session
          check_url /field-notes
          node tests/collect-live.mjs --studium
          echo 'Deployed and verified https://studium.yycholla.com' >> "$GITHUB_STEP_SUMMARY"
