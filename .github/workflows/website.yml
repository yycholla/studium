name: Studium website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Finish migrations/deployments before another main run can start.
concurrency:
  group: studium-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
      - name: Check and build in devenv
        run: devenv shell -- studium-check
      - name: Verify lockfiles stayed unchanged
        run: git diff --exit-code -- devenv.lock package-lock.json Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: studium-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://studium.yycholla.com
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for secret_name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if test -z "${!secret_name}"; then
              echo "::error::Missing $secret_name. Add it in repository Actions secrets."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
      - uses: actions/download-artifact@v4
        with:
          name: studium-site-${{ github.sha }}
          path: dist/
      - name: Apply D1 migrations and deploy checked build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: devenv shell -- bash deploy/cloudflare.sh --built
      - name: Verify public site
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 https://studium.yycholla.com/healthz | grep -Fx ok
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --output /dev/null https://studium.yycholla.com/account
          echo 'Deployed to https://studium.yycholla.com' >> "$GITHUB_STEP_SUMMARY"
